<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reserva y Contacto - Destino Cordillera</title>
  <!-- Solo se enlaza tu CSS propio -->
  <link rel="stylesheet" href="css/styles.css">
</head>
<body class="cuerpo-pagina">

  <header class="cabecera">
    <nav class="navegacion">
      <div class="nav-contenedor">
        <a class="nav-logo" href="index.html">🏔️ Destino Cordillera</a>
        <ul class="nav-enlaces">
          <li><a href="index.html">Inicio</a></li>
          <li><a href="panoramas.html">Panoramas</a></li>
          <li><a href="servicios.html">Alojamiento y Gastronomía</a></li>
          <li><a class="activo" href="contacto.html">Reserva y Contacto</a></li>
        </ul>
      </div>
    </nav>
  </header>

  <main class="principal-contacto" style="background: linear-gradient(rgba(15, 23, 42, 0.7), rgba(15, 23, 42, 0.7)), url('img/fondito.jpg') center/cover no-repeat fixed;">
    <div class="contenedor-formulario">
      <div class="tarjeta-contacto">
        
        <img src="img/atencion.jpg" class="imagen-tarjeta" alt="Atención y Reservas">
        
        <div class="cuerpo-tarjeta">
          <h1 class="titulo-formulario">Reserva y Contacto</h1>
          <p class="descripcion-formulario">Completa el formulario para consultar disponibilidad o resolver tus dudas. Te responderemos a la brevedad.</p>
          
          <form class="formulario">
            <div class="grupo-input">
              <label for="nombre">Nombre Completo</label>
              <input type="text" id="nombre" placeholder="Ej. Juan Pérez" required>
            </div>

            <div class="grupo-input">
              <label for="email">Correo Electrónico</label>
              <input type="email" id="email" placeholder="nombre@ejemplo.com" required>
            </div>

            <div class="grupo-input">
              <label for="motivo">Motivo del Contacto</label>
              <select id="motivo" required>
                <option value="">Selecciona una opción...</option>
                <option value="reserva">Reserva de Alojamiento</option>
                <option value="tour">Consulta de Panoramas</option>
                <option value="duda">Duda General</option>
              </select>
            </div>

            <div class="grupo-input">
              <label for="habitacion">Alojamiento de interés</label>
              <select id="habitacion" required>
                <option value="">Selecciona el tipo de habitación...</option>
                <option value="">Solo Consulta (No Alojamiento)</option>
                <option value="premium">Refugio Cordillera Premium - Desde $180.000/noche</option>
                <option value="estandar">Cabañas Valle Cordillerano - Desde $90.000/noche</option>
                <option value="economico">Hostal Los Pinos - Desde $35.000/noche</option>
              </select>
            </div>
            
            <div class="grupo-input">
              <label for="mensaje">Mensaje</label>
              <textarea id="mensaje" rows="4" placeholder="Escribe tu mensaje aquí..." required></textarea>
            </div>
            
            <!-- El botón debe estar dentro de la etiqueta form -->
            <button type="submit" class="btn-enviar">Enviar Mensaje</button>
          </form>
        </div>
      </div>
    </div>
  </main>
<footer class="pie-pagina">
    <p>&copy; 2026 Destino Cordillera. Todos los derechos reservados.</p>
  </footer>
</body>
</html>
